<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laudecir do Forró</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="icon" type="image/png" href="./favicon.png">


<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter',sans-serif;
}


/* =========================
   FUNDO
========================= */

body{

  color:#fff;

  display:flex;
  justify-content:center;
  align-items:center;

  min-height:100vh;

  padding:20px;

  background-image:
    linear-gradient(
      rgba(0,0,0,.58),
      rgba(0,0,0,.68)
    ),
    url("./fundo.jpg");

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  background-attachment:fixed;

}


/* =========================
   CONTAINER
========================= */

.container{

  width:100%;
  max-width:420px;

  padding:28px;

  border-radius:28px;

  background:rgba(255,255,255,.05);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  border:1px solid rgba(255,255,255,.10);

  box-shadow:
    0 20px 60px rgba(0,0,0,.65);

}


/* =========================
   PERFIL
========================= */

.profile{

  text-align:center;

  margin-bottom:22px;

}


.profile img{

  width:110px;
  height:110px;

  border-radius:50%;

  object-fit:cover;

  border:3px solid rgba(255,255,255,.25);

  box-shadow:
    0 0 30px rgba(0,0,0,.6);

}


.profile h2{

  margin-top:12px;

  font-weight:600;

  font-size:21px;

}


.profile p{

  font-size:14px;

  opacity:.72;

  margin-top:4px;

}


.badge{

  display:inline-block;

  margin-top:9px;

  padding:5px 12px;

  font-size:11px;

  border-radius:999px;

  background:rgba(0,255,180,.14);

  color:#00ffc3;

  border:1px solid rgba(0,255,180,.15);

}


/* =========================
   PLAYER
========================= */

.music-player{

  margin:22px 0;

  padding:16px;

  border-radius:20px;

  background:rgba(0,0,0,.28);

  border:1px solid rgba(255,255,255,.10);

  box-shadow:
    0 10px 30px rgba(0,0,0,.20);

}


/* CABEÇALHO DA MÚSICA */

.music-top{

  display:flex;

  align-items:center;

  gap:12px;

}


/* CAPA */

.music-cover{

  width:52px;
  height:52px;

  flex-shrink:0;

  border-radius:14px;

  display:flex;

  align-items:center;
  justify-content:center;

  background:linear-gradient(
    135deg,
    #00ffc3,
    #008cff
  );

  color:#fff;

  font-size:21px;

  box-shadow:
    0 5px 20px rgba(0,0,0,.3);

}


/* INFORMAÇÕES */

.music-info{

  min-width:0;

  flex:1;

}


.music-info strong{

  display:block;

  font-size:13px;

  font-weight:600;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

}


.music-info span{

  display:block;

  margin-top:4px;

  font-size:11px;

  opacity:.55;

}


/* BOTÃO PLAY */

.play-button{

  width:45px;
  height:45px;

  border:none;

  border-radius:50%;

  display:flex;

  align-items:center;
  justify-content:center;

  background:#fff;

  color:#111;

  font-size:15px;

  cursor:pointer;

  transition:.25s;

  flex-shrink:0;

}


.play-button:hover{

  transform:scale(1.08);

  box-shadow:
    0 0 20px rgba(255,255,255,.3);

}


.play-button:active{

  transform:scale(.94);

}


/* BARRA */

.progress-area{

  margin-top:15px;

}


.progress{

  width:100%;

  height:5px;

  appearance:none;

  -webkit-appearance:none;

  background:rgba(255,255,255,.15);

  border-radius:10px;

  cursor:pointer;

}


.progress::-webkit-slider-thumb{

  appearance:none;
  -webkit-appearance:none;

  width:13px;
  height:13px;

  border-radius:50%;

  background:#00ffc3;

  box-shadow:
    0 0 10px rgba(0,255,195,.5);

}


.progress::-moz-range-thumb{

  width:13px;
  height:13px;

  border:none;

  border-radius:50%;

  background:#00ffc3;

}


/* TEMPOS */

.time{

  display:flex;

  justify-content:space-between;

  margin-top:6px;

  font-size:10px;

  opacity:.5;

}


/* CONTROLE DE VOLUME */

.player-bottom{

  display:flex;

  justify-content:flex-end;

  align-items:center;

  gap:8px;

  margin-top:10px;

}


.player-bottom i{

  font-size:12px;

  opacity:.55;

}


.volume{

  width:75px;

  height:4px;

  appearance:none;

  -webkit-appearance:none;

  background:rgba(255,255,255,.15);

  border-radius:10px;

  cursor:pointer;

}


.volume::-webkit-slider-thumb{

  appearance:none;
  -webkit-appearance:none;

  width:11px;
  height:11px;

  border-radius:50%;

  background:#fff;

}


.volume::-moz-range-thumb{

  width:11px;
  height:11px;

  border:none;

  border-radius:50%;

  background:#fff;

}


/* =========================
   BOTÕES
========================= */

.buttons{

  display:grid;

  grid-template-columns:repeat(3,1fr);

  gap:10px;

  margin:22px 0;

}


.btn{

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:8px;

  min-height:82px;

  padding:12px 6px;

  border-radius:16px;

  text-decoration:none;

  font-weight:500;

  font-size:12px;

  background:rgba(255,255,255,.06);

  border:1px solid rgba(255,255,255,.10);

  transition:.25s;

}


.btn i{

  font-size:29px;

}


.btn:hover{

  transform:translateY(-4px) scale(1.02);

  background:rgba(255,255,255,.12);

  box-shadow:
    0 8px 25px rgba(0,0,0,.3);

}


.btn.whatsapp{

  color:#25D366;

}


.btn.instagram{

  color:#E1306C;

}


.btn.site{

  color:#d0dee4;

}


.btn.telefone{

  color:#38bdf8;

}


.btn.youtube{

  color:#ff0000;

}


/* =========================
   SERVIÇOS / INFORMAÇÕES
========================= */

.services{

  margin-top:12px;

}


.services h3{

  font-size:14px;

  margin-bottom:10px;

  opacity:.8;

}


.service-item{

  display:flex;

  justify-content:space-between;

  align-items:center;

  background:rgba(255,255,255,.05);

  padding:12px;

  border-radius:12px;

  margin-bottom:8px;

  font-size:13px;

  border:1px solid rgba(255,255,255,.06);

}


.service-item span{

  opacity:.6;

  font-size:11px;

}


/* =========================
   FOOTER
========================= */

.footer{

  text-align:center;

  font-size:10px;

  margin-top:18px;

  opacity:.45;

}


/* =========================
   CELULAR
========================= */

@media(max-width:600px){

  body{

    background-image:
      linear-gradient(
        rgba(0,0,0,.58),
        rgba(0,0,0,.68)
      ),
      url("./fundo-mobile.jpg");

    background-position:center;

    background-attachment:scroll;

  }

}


@media(max-width:360px){

  .container{

    padding:22px;

  }

  .buttons{

    gap:7px;

  }

  .btn{

    min-height:78px;

  }

  .btn i{

    font-size:27px;

  }

}


/* =========================
   ANIMAÇÃO DA CAPA
========================= */

.music-cover.playing{

  animation:

    pulse 1.5s infinite;

}


@keyframes pulse{

  0%{

    transform:scale(1);

  }

  50%{

    transform:scale(1.06);

  }

  100%{

    transform:scale(1);

  }

}

</style>

</head>


<body>


<div class="container">


  <!-- =====================
       PERFIL
  ====================== -->

    >

   <!-- <p>Cantor Brasileiro</p> -->

    <div class="badge">
    Cantor Brasileiro
    </div>

    Capixaba
    </div>

  </div>


  <!-- =====================
       PLAYER
  ====================== -->

  <div class="music-player">

    <div class="music-top">


      <div class="music-cover" id="musicCover">

        <i class="fa-solid fa-music"></i>

      </div>


      <div class="music-info">

        <strong>

        </strong>

        <span>

        </span>

      <button
        class="play-button"

      ></i>

      ></i>

    </div>


    <!-- ÁUDIO -->

    <audio
      id="audio"

        src="./Rainha do Paredão - Laudecir Do Forro.mp3"
        type="audio/mpeg"
      >

      Seu navegador não suporta áudio.

    </audio>

  <!-- =====================
       REDES / CONTATOS
  ====================== -->

  <div class="buttons">


    <a
      href="https://wa.me/5527998364580?text=Olá%2C%20gostaria%20de%20saber%20mais%20sobre%20shows%20e%20contratação%20do%20Laudecir%20do%20Forró."

  </div>
-->

  <!-- =====================
       FOOTER
  ====================== -->

  <div class="footer">

 Criado por <a href="http://www.chamaos.com/" target="_blank">
  <span style="color:#fff;">ChamaOS.</span>
</a>

  </div>


</div>


<script>

/* =========================
   PLAYER
========================= */

const audio =
  document.getElementById("audio");

const playButton =
  document.getElementById("playButton");

const progress =
  document.getElementById("progress");

const volume =
  document.getElementById("volume");

const currentTime =
  document.getElementById("currentTime");

const duration =
  document.getElementById("duration");

const musicCover =
  document.getElementById("musicCover");


/* =========================
   FORMATA TEMPO
========================= */

function formatTime(seconds){

  if(isNaN(seconds)){
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const secs =
    Math.floor(seconds % 60)
      .toString()
      .padStart(2,"0");

  return `${minutes}:${secs}`;

}


/* =========================
   PLAY / PAUSE
========================= */

playButton.addEventListener(
  "click",
  function(){

    if(audio.paused){

      audio.play();

    }else{

      audio.pause();

    }

  }
);


/* =========================
   ATUALIZA BOTÃO
========================= */

audio.addEventListener(
  "play",
  function(){

    playButton.innerHTML =
      '<i class="fa-solid fa-pause"></i>';

    musicCover.classList.add(
      "playing"
    );

  }
);


audio.addEventListener(
  "pause",
  function(){

    playButton.innerHTML =
      '<i class="fa-solid fa-play"></i>';

    musicCover.classList.remove(
      "playing"
    );

  }
);


/* =========================
   DURAÇÃO
========================= */

audio.addEventListener(
  "loadedmetadata",
  function(){

    duration.textContent =
      formatTime(audio.duration);

  }
);


/* =========================
   PROGRESSO
========================= */

audio.addEventListener(
  "timeupdate",
  function(){

    const percent =
      (audio.currentTime /
      audio.duration) * 100;

    progress.value =
      isNaN(percent) ? 0 : percent;

    currentTime.textContent =
      formatTime(audio.currentTime);

  }
);


/* =========================
   CLICAR NA BARRA
========================= */

progress.addEventListener(
  "input",
  function(){

    if(audio.duration){

      audio.currentTime =
        (progress.value / 100)
        * audio.duration;

    }

  }
);


/* =========================
   VOLUME
========================= */

volume.addEventListener(
  "input",
  function(){

    audio.volume =
      volume.value;

  }
);


/* =========================
   VOLUME INICIAL
========================= */

audio.volume = 0.8;


/* =========================
   QUANDO TERMINAR
========================= */

audio.addEventListener(
  "ended",
  function(){

    progress.value = 0;

    currentTime.textContent =
      "0:00";

  }
);

</script>
